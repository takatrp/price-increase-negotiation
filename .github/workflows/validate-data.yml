name: Validate data

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate data
        run: |
          node scripts/validate-data.mjs
          TZ=UTC node scripts/test-minimum-wage.mjs
          TZ=America/Los_Angeles node scripts/test-minimum-wage.mjs
          TZ=Asia/Tokyo node scripts/test-minimum-wage.mjs
